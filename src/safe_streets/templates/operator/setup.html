{% extends "operator/base.html" %}{% block title %}Set a password{% endblock %}{% block main %}
<h1>Set the operator's password</h1>
{% if error %}<p class="bad">{{ error }}</p>{% endif %}
<form method="post" action="/operator/setup" class="card" style="max-width:24rem">
  <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="token" value="{{ token }}">
  <p><label>Password (12 characters or more)<br><input type="password" name="password" autocomplete="new-password" minlength="12" required style="width:100%"></label></p>
  <p><label>Again<br><input type="password" name="password2" autocomplete="new-password" minlength="12" required style="width:100%"></label></p>
  <p><button class="primary">Set it and sign in</button></p>
</form>
<p class="soft">This link works once and for 24 hours.</p>
{% endblock %}
