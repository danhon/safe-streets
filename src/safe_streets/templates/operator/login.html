{% extends "operator/base.html" %}{% block title %}Sign in{% endblock %}{% block main %}
<h1>Sign in</h1>
{% if error %}<p class="bad">{{ error }}</p>{% endif %}
<form method="post" action="/operator/login" class="card" style="max-width:24rem">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <p><label>Password<br><input type="password" name="password" autocomplete="current-password" autofocus required style="width:100%"></label></p>
  <p><button class="primary">Sign in</button></p>
</form>
<p class="soft">Lost the password? On the machine running safe-streets, run <code>safe-streets reset-password</code> for a new setup link.</p>
{% endblock %}
