<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>The Street Zoo</title>
<style>
:root { --bg:#fff8ec; --ink:#2b2118; --soft:#7a6a58; --card:#fff; --line:#eadcc6; --hot:#d9412b; --ok:#2f8f5b; --road:#5b5550; --dash:#f5d76e; --verge:#9fcf7a; }
@media (prefers-color-scheme: dark) { :root { --bg:#1d1813; --ink:#f4ead9; --soft:#b7a68f; --card:#2a231c; --line:#3d332a; --hot:#ff7a5c; --ok:#6fd39c; --road:#3a3532; --dash:#c9ad4e; --verge:#3f6a2f; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; }
main { max-width: 920px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: clamp(2.2rem, 8vw, 3.6rem); margin: 0; letter-spacing: -.02em; }
.mode { font: 600 .9rem/1 system-ui, sans-serif; vertical-align: middle; margin-left: 8px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; letter-spacing: 0; }
.mp { width: 1.9em; height: 1.3em; vertical-align: -.2em; }
.names .e .mp { width: 2.6em; height: 1.8em; }
.pel .wh { transform-box: fill-box; transform-origin: center; animation: spin 1s linear infinite; }
@keyframes spin { to { rotate: 360deg; } }
.pel .bird { animation: ride .5s ease-in-out infinite alternate; }
@keyframes ride { to { translate: 0 -1.5px; } }
.pel .pouch { transform-box: fill-box; transform-origin: 0 0; animation: gulp 2.4s ease-in-out infinite; }
@keyframes gulp { 0%,80%,100% { scale: 1 1; } 88% { scale: 1 1.5; } }
.pel .scarf { animation: flap .25s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 100% 50%; }
@keyframes flap { to { scale: 1 .6; rotate: -4deg; } }
.pel .jet path { animation: flick .08s steps(2) infinite; transform-box: fill-box; transform-origin: 100% 50%; } @keyframes flick { 50% { scale: .7 1; } }
.walker.pw { top: 56px; }
.sub { color: var(--soft); margin: .2rem 0 1.25rem; }
h2 { font-size: 1.05rem; margin: 2rem 0 .7rem; }
/* the live parade */
.lane { position: relative; height: 160px; border-radius: 18px; overflow: hidden; background:
  linear-gradient(var(--verge) 0 60px, var(--road) 60px 140px, var(--verge) 140px); }
.lane::before { content:""; position:absolute; left:0; right:0; top: 98px; height: 4px; background: repeating-linear-gradient(90deg, var(--dash) 0 26px, transparent 26px 52px); }
.walker { position:absolute; left: 0; top: 76px; z-index: 3; font-size: 44px; line-height: 1; will-change: transform; filter: drop-shadow(0 3px 2px rgba(0,0,0,.25)); }
.walker .body { display:inline-block; transform-origin: 50% 90%; }
.walker .body.right { transform: scaleX(-1); }
/* each animal moves like itself (individual transform properties, so the flip in transform stays) */
.k0 { animation: glide 1.6s ease-in-out infinite; }
.k1 { animation: plod 1.1s ease-in-out infinite; }
.k2 { animation: waddle .42s ease-in-out infinite; }
.k3 { animation: hop .6s cubic-bezier(.3,0,.4,1) infinite; }
.k4 { animation: gallop .38s linear infinite; }
.k5 { animation: sprint .2s ease-in-out infinite; scale: 1.18 .9; }
.k6 { animation: shake .07s linear infinite; }
@keyframes glide { 0%,100% { scale: 1 1; } 50% { scale: 1.16 .9; } }
@keyframes plod { 0%,100% { translate: 0 0; rotate: 0deg; } 25% { translate: 0 -3px; rotate: -3deg; } 50% { translate: 0 0; } 75% { translate: 0 -3px; rotate: 3deg; } }
@keyframes waddle { 0%,100% { rotate: -11deg; translate: 0 0; } 50% { rotate: 11deg; translate: 0 -2px; } }
@keyframes hop { 0% { translate: 0 0; scale: 1.15 .85; } 20% { scale: .9 1.12; } 50% { translate: 0 -30px; scale: .95 1.05; } 80% { translate: 0 0; scale: 1.05 .95; } 100% { translate: 0 0; scale: 1.15 .85; } }
@keyframes gallop { 0% { translate: 0 0; rotate: 0deg; } 30% { translate: 0 -10px; rotate: -7deg; } 65% { translate: 0 -3px; rotate: 5deg; } 100% { translate: 0 0; rotate: 0deg; } }
@keyframes sprint { 0%,100% { translate: 0 2px; } 50% { translate: 0 -3px; } }
@keyframes shake { 0% { translate: 0 1px; } 50% { translate: 1px -1px; } 100% { translate: -1px 0; } }
.lines { position:absolute; top: 18px; font-size: 26px; color: rgba(255,255,255,.75); letter-spacing: -6px; }
.puff, .slime { position:absolute; border-radius: 50%; pointer-events: none; }
.puff { width: 16px; height: 16px; background: rgba(230,230,230,.75); }
.slime { width: 10px; height: 4px; top: 120px; background: rgba(190,255,190,.55); }
.cam { position:absolute; left: 50%; top: 11px; transform: translateX(-50%); font-size: 15px; font-weight: 800; background: #fff; color: #c22; border: 3px solid #c22; border-radius: 50%; width: 38px; height: 38px; box-sizing: border-box; display:grid; place-items:center; z-index: 1; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.zap { position:absolute; top: 20px; font: 800 13px system-ui, sans-serif; color: #fff; background: #c22; padding: 1px 7px; border-radius: 999px; z-index: 4; pointer-events: none; white-space: nowrap; }
.huh { position:absolute; top: -6px; font-size: 18px; }
.bar .col { animation: grow .9s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes grow { from { transform: scaleY(0); } }
.ticker { display:grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: start; color: var(--soft); font-size: .9rem; line-height: 1.4; margin: .5rem 2px 0; }
/* #now is as tall as the day's longest line at this width (sizeNow), so a short line never moves the page */
#now { min-height: 1.4em; overflow: hidden; }
#tally { white-space: nowrap; }
@media (max-width: 560px) { .ticker { grid-template-columns: 1fr; } #tally { order: -1; } }
.ticker b { color: var(--ink); }
/* the ruler */
.ruler { background: var(--card); border:1px solid var(--line); border-radius: 18px; padding: 16px 14px 12px; }
.bars { display:grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 8px; align-items: end; height: 150px; position: relative; }
.bar { display:flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; cursor: pointer; }
.bar .c { font-weight: 800; font-size: 1.15rem; }
.bar .col { width: 70%; border-radius: 10px 10px 4px 4px; background: var(--ok); opacity: .85; transition: transform .25s; transform-origin: bottom; }
.bar.over .col { background: var(--hot); } .bar.over .c { color: var(--hot); } .bar:not(.over) .c { color: var(--ok); }
.bar:hover .col, .bar.sel .col { transform: scaleY(1.04); opacity: 1; }
.names { display:grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 8px; text-align: center; margin-top: 8px; position: relative; }
.names .e { font-size: clamp(1.7rem, 6vw, 2.4rem); }
.names .r { font-size: .72rem; color: var(--soft); line-height: 1.2; }
.limit { position: absolute; top: -170px; bottom: 0; left: calc(3 / 7 * 100% - 2px); border-left: 2px dashed var(--hot); }
.limit span { position: absolute; top: 0; left: 6px; font-size: .7rem; font-weight: 700; color: var(--hot); white-space: nowrap; letter-spacing: .04em; }
.quip { font-size: 1.12rem; background: var(--card); border:1px solid var(--line); border-radius: 18px; padding: 14px 16px; margin: 1rem 0 0; }
.awards { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin-top: 1rem; }
.aw { background: var(--card); border:1px solid var(--line); border-radius: 16px; padding: 12px; text-align:center; }
.aw .e { font-size: 2rem; } .aw b { display:block; } .aw span { color: var(--soft); font-size: .85rem; }
/* hours */
.hour { display:grid; grid-template-columns: 4.2rem 1fr auto; gap: 10px; align-items:center; padding: 8px 10px; border-radius: 12px; margin-bottom: 4px; }
.hour b { font-variant-numeric: tabular-nums; color: var(--soft); font-weight: 600; }
.parade { font-size: 1.5rem; line-height: 1.45; }
.parade span { display:inline-block; cursor: pointer; transition: transform .15s; }
.parade span.right { transform: scaleX(-1); }
.parade span:hover, .parade span:focus { outline: none; font-size: 1.15em; margin: -.1em -.05em; }
.parade span[data-z="0"]:hover { animation: glide 1.6s ease-in-out infinite; }
.parade span[data-z="1"]:hover { animation: plod 1.1s ease-in-out infinite; }
.parade span[data-z="2"]:hover { animation: waddle .42s ease-in-out infinite; }
.parade span[data-z="3"]:hover { animation: hop .6s infinite; }
.parade span[data-z="4"]:hover { animation: gallop .38s linear infinite; }
.parade span[data-z="5"]:hover { animation: sprint .2s infinite; }
.parade span[data-z="6"]:hover { animation: shake .07s linear infinite; }
.parade.dim span:not(.match) { opacity: .15; }
.verdict { font-size: .8rem; color: var(--soft); white-space: nowrap; text-align: right; }
.toast { max-width: 92vw; white-space: normal !important; text-align: center; border-radius: 18px !important; position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(220%); opacity: 0; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: .95rem; transition: transform .2s; pointer-events: none; white-space: nowrap; }
.toast.on { transform: translateX(-50%) translateY(0); opacity: 1; }
.note { color: var(--soft); font-size:.85rem; margin-top: 2.5rem; }
@media (max-width: 560px) { .hour { grid-template-columns: 3.4rem 1fr; } .verdict { grid-column: 2; text-align: left; } .awards { grid-template-columns: 1fr; } .bars { height: 120px; } .limit { top: -140px; } }
@media (prefers-reduced-motion: reduce) { .pel *, .walker .body, .parade span:hover, .bar .col { animation: none !important; } }
</style></head><body><main>
<h1>The Street Zoo <button id="mode" class="mode"></button></h1>
<p class="sub" id="sub"></p>

<div class="lane" id="lane" aria-label="The day's vehicles parading past as animals"><div class="cam" title="the speed camera" id="cam"></div></div>
<div class="ticker"><span id="now">&nbsp;</span><span id="tally"></span></div>

<h2>The day's animals, by speed</h2>
<div class="ruler">
  <div class="bars" id="bars"></div>
  <div class="names" id="names"><div class="limit"><span id="limitlabel"></span></div></div>
</div>
<div class="quip" id="quip"></div>
<div class="awards" id="awards"></div>

<h2>Hour by hour <span style="font-weight:400;color:var(--soft);font-size:.9rem">(tap an animal; tap a bar above to find its kind)</span></h2>
<div id="hours"></div>
<p class="note">Every animal (or pelican) is one vehicle that passed that day, filed under its quarter hour and facing the way it went. No pictures, colours or makes: just how fast, in animals.</p>
</main>
<div class="toast" id="toast"></div>
<!--COMMON-->
<script>
// ---- Pelican mode: every vehicle a pelican on a bicycle, each one unique ----
const PELICAN = (() => {
  const q = new URLSearchParams(location.search).get("pelican");
  if (q != null) { try { localStorage.setItem("pelican", q === "1" ? "1" : "0"); } catch (e) {} return q === "1"; }
  try { return localStorage.getItem("pelican") === "1"; } catch (e) { return false; }
})();
const PEL = (() => {
  const NAMES = ["Agnes","Beatrix","Clementine","Delphine","Edith","Florence","Gertrude","Hazel","Imogen","Juniper","Kiki","Lulu","Mabel","Nora","Olive","Petra","Queenie","Rosalind","Sybil","Tallulah","Ursula","Vera","Winifred","Ximena","Yolanda","Zelda","Archibald","Bartholomew","Cuthbert","Desmond","Ezra","Fitzgerald","Gus","Horace","Ignatius","Jasper","Kofi","Leopold","Mungo","Neville","Otis","Percival","Pip","Sam","Robin","Frankie"];
  const BIKES = ["road bike","BMX","penny-farthing","cargo bike","tricycle","mountain bike","Dutch bike","folding bike"];
  const HATS = ["", "helmet", "top hat", "beanie", "cowboy hat", "crown", "party hat", "flat cap", "racing cap"];
  const EXTRAS = ["", "a scarf", "sunglasses", "a bow tie", "a fish in the pouch", "goggles", "a scarf and sunglasses", "a fish and a bow tie"];
  const PLUMES = [["white", "#f6f3ec", "#d9d2c3"], ["brown", "#b89a76", "#8a6d4f"], ["pink", "#f2c4c4", "#d89a9a"], ["grey", "#cfd4da", "#9aa3ad"], ["cream", "#efe4c8", "#cbbd96"]];
  const BILLS = ["#f39c34", "#f2c230", "#e8665a"];
  const COLOURS = ["#e74c3c", "#3b82f6", "#22a06b", "#a855f7", "#f59e0b", "#ec4899", "#14b8a6", "#334155"];
  const QUIRKS = [
    ["stops to admire every puddle", "is reading a map upside down", "has stopped pedalling to eat a sandwich", "is technically still moving"],
    ["rings the bell at clouds", "hums sea shanties", "is out for a gentle pootle", "waves at every pigeon"],
    ["signals every turn, even the imaginary ones", "is exactly as fast as the sign says, and proud of it", "wears high-vis over the high-vis", "has read the Highway Code twice, for fun"],
    ["insists the sign said 25", "is mildly late for a fish", "pedals like nobody's watching (we are)", "thinks 'twenty' is a vibe, not a rule"],
    ["is late for the fish market", "is racing a seagull nobody else can see", "has never once used the brakes", "is wearing a heart-rate monitor, ominously"],
    ["thinks the Tour de France comes this way", "has removed the brakes, for weight", "is drafting behind nothing at all", "shouts 'on your left!' at empty air"],
    ["is attempting the seabird land speed record", "has a small rocket strapped to the rack", "is fleeing an angry fishmonger", "left the atmosphere briefly near the school"],
  ];
  const BANDS = [["pootler", "pootlers"], ["pedaller", "pedallers"], ["proper cyclist", "proper cyclists"], ["hurrier", "hurriers"], ["scorcher", "scorchers"], ["kamikaze", "kamikazes"], ["missile", "missiles"]];
  const TOTAL = NAMES.length * BIKES.length * HATS.length;          // 3,312 combinations
  function persona(i, band) {
    const j = (i * 2861 + 17) % TOTAL;                                // a bijection: no two vehicles share name, bike and hat
    const name = NAMES[j % NAMES.length], bike = Math.floor(j / NAMES.length) % BIKES.length, hat = Math.floor(j / (NAMES.length * BIKES.length));
    const r = k => rnd(i * 13 + k);
    return {name, bike, hat, band, extra: Math.floor(r(1) * EXTRAS.length), plume: Math.floor(r(2) * PLUMES.length),
      bill: BILLS[Math.floor(r(3) * BILLS.length)], colour: COLOURS[Math.floor(r(4) * COLOURS.length)], colour2: COLOURS[Math.floor(r(5) * COLOURS.length)],
      quirk: QUIRKS[band][Math.floor(r(6) * 4)]};
  }
  function describe(pp) {
    const hat = HATS[pp.hat], ex = EXTRAS[pp.extra];
    return `${pp.name}, a ${PLUMES[pp.plume][0]} pelican on a ${BIKES[pp.bike]}${hat ? ` in a ${hat}` : ""}${ex ? `, with ${ex}` : ""}, ${pp.quirk}`;
  }
  // bike geometry (130×100 box, facing right): wheels, crank, seat, head tube, bars
  function geom(b) {
    const G = {rear: [30, 78, 17], front: [98, 78, 17], crank: [62, 78], seat: [52, 50], head: [88, 54], bars: [90, 44], tyre: 3};
    if (b === 1) Object.assign(G, {rear: [36, 84, 12], front: [88, 84, 12], crank: [62, 84], seat: [54, 62], head: [84, 64], bars: [84, 52]});
    if (b === 2) Object.assign(G, {rear: [20, 88, 8], front: [86, 68, 28], crank: [86, 68], seat: [74, 34], head: [86, 40], bars: [94, 34]});
    if (b === 3) Object.assign(G, {rear: [22, 82, 13], front: [112, 84, 11], crank: [52, 82], seat: [42, 54], head: [104, 58], bars: [104, 46]});
    if (b === 4) Object.assign(G, {rear: [30, 82, 13], front: [96, 76, 19], crank: [96, 76], seat: [58, 52], head: [92, 52], bars: [92, 44]});
    if (b === 5) Object.assign(G, {tyre: 5.5, rear: [30, 78, 18], front: [98, 78, 18]});
    if (b === 6) Object.assign(G, {seat: [50, 46], bars: [84, 38]});
    if (b === 7) Object.assign(G, {rear: [36, 86, 10], front: [92, 86, 10], crank: [62, 86], seat: [56, 54], head: [86, 60], bars: [86, 46]});
    return G;
  }
  function wheel(x, y, r, tyre, spin) {
    const sp = [0, 45, 90, 135].map(a => { const c = Math.cos(a * Math.PI / 180) * r, s = Math.sin(a * Math.PI / 180) * r; return `<line x1="${x - c}" y1="${y - s}" x2="${x + c}" y2="${y + s}" stroke="#666" stroke-width=".8"/>`; }).join("");
    return `<g class="wh" style="animation-duration:${spin}s"><circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#222" stroke-width="${tyre}"/>${sp}<circle cx="${x}" cy="${y}" r="1.6" fill="#444"/></g>`;
  }
  function hatSVG(k, x, y, pp) {
    const c = pp.colour, c2 = pp.colour2;
    return ["",
      `<path d="M${x - 9},${y - 3} Q${x},${y - 18} ${x + 9},${y - 3}Z" fill="${c}"/><path d="M${x - 9},${y - 3} H${x + 11}" stroke="${c2}" stroke-width="2"/>`,
      `<rect x="${x - 6}" y="${y - 22}" width="12" height="16" fill="#1f1f1f"/><rect x="${x - 6}" y="${y - 10}" width="12" height="3" fill="${c}"/><rect x="${x - 10}" y="${y - 7}" width="20" height="3" rx="1" fill="#1f1f1f"/>`,
      `<path d="M${x - 8},${y - 3} Q${x},${y - 17} ${x + 8},${y - 3}Z" fill="${c}"/><circle cx="${x}" cy="${y - 15}" r="3" fill="${c2}"/>`,
      `<ellipse cx="${x}" cy="${y - 5}" rx="13" ry="3" fill="#8b5a2b"/><path d="M${x - 7},${y - 5} Q${x - 6},${y - 17} ${x},${y - 13} Q${x + 6},${y - 17} ${x + 7},${y - 5}Z" fill="#a0692f"/>`,
      `<path d="M${x - 8},${y - 4} L${x - 8},${y - 14} L${x - 4},${y - 9} L${x},${y - 16} L${x + 4},${y - 9} L${x + 8},${y - 14} L${x + 8},${y - 4}Z" fill="#f2c230" stroke="#b8860b" stroke-width=".8"/>`,
      `<path d="M${x - 7},${y - 4} L${x},${y - 24} L${x + 7},${y - 4}Z" fill="${c}"/><path d="M${x - 4},${y - 12} L${x + 4},${y - 13}" stroke="${c2}" stroke-width="2"/><circle cx="${x}" cy="${y - 24}" r="2.2" fill="${c2}"/>`,
      `<path d="M${x - 9},${y - 4} Q${x - 2},${y - 14} ${x + 7},${y - 7} L${x + 14},${y - 4}Z" fill="#6b5b4b"/>`,
      `<path d="M${x - 8},${y - 3} Q${x - 2},${y - 15} ${x + 6},${y - 3}Z" fill="${c}"/><path d="M${x + 4},${y - 4} L${x + 16},${y - 2}" stroke="${c}" stroke-width="3" stroke-linecap="round"/>`,
    ][k];
  }
  // the whole rider; legs (class "leg") are redrawn each frame by the parade
  function svg(pp, mph, size) {
    const G = geom(pp.bike), [pl, plDark] = PLUMES[pp.plume].slice(1), sx = G.seat[0], sy = G.seat[1];
    const spin = Math.max(.12, 6 / Math.max(mph * TO_MPH, 3));
    let s = "";
    if (pp.band === 6) s += `<g class="jet"><path d="M${G.rear[0] - 4},${G.seat[1] + 4} l-18,-4 l4,4 l-6,3 l20,1Z" fill="#ff8a00"/><rect x="${G.rear[0] - 6}" y="${G.seat[1] + 1}" width="14" height="7" rx="3" fill="#9aa3ad"/></g>`;
    s += wheel(...G.rear, G.tyre, spin);
    if (pp.bike === 4) s += `<g opacity=".55">${wheel(G.rear[0] + 6, G.rear[1] - 2, G.rear[2], G.tyre, spin)}</g>`;
    s += wheel(...G.front, G.tyre, spin);
    const fr = pp.colour;
    s += `<path d="M${G.rear[0]},${G.rear[1]} L${G.crank[0]},${G.crank[1]} L${sx},${sy + 4} Z M${G.crank[0]},${G.crank[1]} L${G.head[0]},${G.head[1]} L${G.front[0]},${G.front[1]} M${sx},${sy + 4} L${G.head[0]},${G.head[1]} L${G.bars[0]},${G.bars[1]}" fill="none" stroke="${fr}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
    s += `<path d="M${G.bars[0] - 4},${G.bars[1]} h8" stroke="#222" stroke-width="3" stroke-linecap="round"/><path d="M${sx - 7},${sy + 3} h12" stroke="#222" stroke-width="4" stroke-linecap="round"/>`;
    if (pp.bike === 3) s += `<rect x="${G.head[0] - 30}" y="${G.front[1] - 30}" width="26" height="18" rx="2" fill="#c08a4a" stroke="#7a5326"/><path d="M${G.head[0] - 26},${G.front[1] - 30} q5,-8 11,0" fill="#9fb4c7"/>`;
    if (pp.bike === 6) s += `<path d="M${G.bars[0] + 2},${G.bars[1] + 2} h14 l-2,10 h-10Z" fill="#c9a36a" stroke="#8a6d3b"/><circle cx="${G.bars[0] + 8}" cy="${G.bars[1] + 1}" r="2.5" fill="#ec4899"/>`;
    s += `<g class="leg-g"><path class="leg" d="" stroke="${pp.bill}" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path class="leg" d="" stroke="${pp.bill}" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/></g>`;
    s += `<g class="crank"><circle cx="${G.crank[0]}" cy="${G.crank[1]}" r="4" fill="#333"/><line class="arm" x1="${G.crank[0]}" y1="${G.crank[1]}" x2="${G.crank[0]}" y2="${G.crank[1]}" stroke="#333" stroke-width="2.2"/></g>`;
    // the pelican, seated
    const bx = sx - 4, by = sy - 12, hx = sx + 16, hy = sy - 46;
    let b = `<g class="bird">`;
    if (pp.extra === 1 || pp.extra === 6) b += `<path class="scarf" d="M${hx - 6},${hy + 20} q-12,-2 -20,4 q-8,6 -16,2" stroke="${pp.colour2}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
    b += `<path d="M${bx - 18},${by + 2} L${bx - 30},${by - 4} L${bx - 22},${by + 8}Z" fill="${plDark}"/>`;
    b += `<ellipse cx="${bx}" cy="${by}" rx="19" ry="13" fill="${pl}" stroke="${plDark}" stroke-width="1"/>`;
    b += `<path d="M${bx - 14},${by - 3} Q${bx + 2},${by - 14} ${bx + 14},${by - 2} Q${bx + 2},${by + 4} ${bx - 14},${by - 1}Z" fill="${plDark}"/>`;
    b += `<path d="M${bx + 12},${by - 2} L${G.bars[0] - 2},${G.bars[1]}" stroke="${plDark}" stroke-width="3.5" stroke-linecap="round"/>`;
    b += `<path d="M${bx + 10},${by - 8} Q${hx + 6},${hy + 22} ${hx},${hy + 4}" stroke="${pl}" stroke-width="8" fill="none" stroke-linecap="round"/>`;
    b += `<circle cx="${hx}" cy="${hy}" r="8" fill="${pl}" stroke="${plDark}" stroke-width="1"/>`;
    b += `<g class="pouch"><path d="M${hx + 5},${hy + 3} Q${hx + 22},${hy + 16} ${hx + 36},${hy + 6} L${hx + 6},${hy + 1}Z" fill="${pp.bill}" opacity=".85"/>${pp.extra === 4 || pp.extra === 7 ? `<path d="M${hx + 16},${hy + 7} q6,-4 12,0 q-6,4 -12,0Z M${hx + 28},${hy + 7} l4,-3 v6Z" fill="#a9b8c6"/>` : ""}</g>`;
    b += `<path d="M${hx + 5},${hy - 2} L${hx + 40},${hy + 5} L${hx + 6},${hy + 2}Z" fill="${pp.bill}"/>`;
    b += pp.extra === 2 || pp.extra === 6 ? `<rect x="${hx - 1}" y="${hy - 4}" width="10" height="4.5" rx="1.5" fill="#111"/>` : pp.extra === 5 ? `<circle cx="${hx + 3}" cy="${hy - 2}" r="3.6" fill="#bde3ff" stroke="#555" stroke-width="1.6"/>` : `<circle cx="${hx + 3}" cy="${hy - 2}" r="1.6" fill="#111"/>`;
    if (pp.extra === 3 || pp.extra === 7) b += `<path d="M${hx - 4},${hy + 14} l-6,-4 v8Z M${hx - 4},${hy + 14} l6,-4 v8Z" fill="${pp.colour2}"/>`;
    b += hatSVG(pp.hat, hx - 1, hy - 5, pp);
    b += `</g>`;
    return {html: `<svg class="pel" viewBox="-30 -10 160 110" width="${size}" height="${size * 110 / 160}">${s}${b}</svg>`, G};
  }
  // static mini icons, one per band, for the ruler and the hour rows
  function symbols() {
    return `<svg width="0" height="0" style="position:absolute" aria-hidden="true">` + BANDS.map((_, k) => {
      const pp = {name: "", bike: k === 2 ? 6 : k === 6 ? 0 : [1, 7, 6, 0, 5, 0, 0][k], hat: [3, 7, 1, 8, 8, 1, 2][k], band: k, extra: [4, 1, 3, 0, 2, 5, 6][k], plume: [4, 1, 0, 3, 0, 2, 1][k], bill: BILLS[0], colour: COLOURS[k], colour2: COLOURS[(k + 3) % 8], quirk: ""};
      const out = svg(pp, 10, 40); const G = out.G;
      const legs = `<path d="M${G.seat[0] + 2},${G.seat[1] - 2} L${G.crank[0] + 2},${G.crank[1] - 12} L${G.crank[0] + 5},${G.crank[1]}" stroke="${BILLS[0]}" stroke-width="2.6" fill="none"/>`;
      return `<symbol id="pb${k}" viewBox="-30 -10 160 110">${out.html.replace(/^<svg[^>]*>|<\/svg>$/g, "").replace('<g class="leg-g">', `<g>${legs}`)}</symbol>`;
    }).join("") + `</svg>`;
  }
  return {persona, describe, svg, symbols, BANDS};
})();

// Bands step from the limit: the duck is "at or under the limit", each band a
// step (5 mph, 8 km/h) either side of it.
const STEP = UNIT === "km/h" ? 8 : 5;
const ZOO = [
  {d: -2, e: "🐌", one: "snail", n: "snails", quip: "basically parked"},
  {d: -1, e: "🐢", one: "tortoise", n: "tortoises", quip: "taking in the view"},
  {d: 0, e: "🦆", one: "duck", n: "ducks", quip: "perfectly legal"},
  {d: 1, e: "🐇", one: "rabbit", n: "rabbits", quip: "a bit hoppy"},
  {d: 2, e: "🐎", one: "horse", n: "horses", quip: "galloping"},
  {d: 3, e: "🐆", one: "cheetah", n: "cheetahs", quip: "way too fast"},
  {d: 99, e: "🚀", one: "rocket", n: "rockets", quip: "achieved low orbit"},
].map((z, i, all) => {
  const max = z.d === 99 ? 9999 : LIMIT + z.d * STEP, lo = i ? LIMIT + all[i - 1].d * STEP + 1 : 0;
  return {...z, max, r: i === 0 ? `up to ${max}` : z.d === 99 ? `${lo} and up` : `${lo}–${max}`};
});
document.getElementById("cam").textContent = LIMIT;
document.getElementById("limitlabel").textContent = `THE LIMIT · ${LIMIT}`;
if (PELICAN) {
  document.body.insertAdjacentHTML("afterbegin", PEL.symbols());
  ZOO.forEach((z, k) => { z.e = `<svg class="mp" viewBox="-30 -10 160 110"><use href="#pb${k}"/></svg>`; [z.one, z.n] = PEL.BANDS[k]; });
  ZOO[2].quip = "the legal limit, on two wheels"; ZOO[6].quip = "rocket-assisted";
}
const zi = mph => ZOO.findIndex(z => mph <= z.max);
const A = p => ZOO[zi(p.mph)];
const facing = p => PELICAN ? (p.dir < 0 ? "right" : "") : (p.dir > 0 && A(p).e !== "🚀") ? "right" : "";
const PERS = P.map((p, i) => PEL.persona(i, zi(p.mph)));
const say = p => PELICAN ? `${PEL.describe(PERS[P.indexOf(p)])} · ${p.mph} ${UNIT} · ${quarterRange(p.q)}` : `${A(p).e} ${A(p).one} · ${p.rough ? "roughly" : "about"} ${p.mph} ${UNIT} · ${quarterRange(p.q)}${p.dir < 0 ? " · the wrong way!" : ""}`;
const counts = ZOO.map((z, i) => P.filter(p => zi(p.mph) === i).length);
document.getElementById("sub").textContent = `${DAY_NAME} · ${STATS.n} visitors · the limit is ${PELICAN ? "one proper cyclist" : "one duck"} (${LIMIT} ${UNIT})`;
document.getElementById("mode").textContent = PELICAN ? "🐾 Animal mode" : "🚲 Pelican mode";
document.getElementById("mode").onclick = () => { location.search = PELICAN ? "?pelican=0" : "?pelican=1"; };
if (PELICAN) { document.querySelector("h1").firstChild.textContent = "The Street Peloton "; document.title = "The Street Peloton"; }
if (PELICAN) {
  document.querySelectorAll("h2").forEach(h => { h.innerHTML = h.innerHTML.replace("The day's animals, by speed", "The day's riders, by speed").replace("tap an animal", "tap a rider"); });
}

// ruler
const maxC = Math.max(1, ...counts);  // 1: an empty day's bars stay flat, not NaN
document.getElementById("bars").innerHTML = ZOO.map((z, i) =>
  `<div class="bar ${z.max > LIMIT ? "over" : ""}" data-i="${i}" title="${z.n}: ${z.quip}"><div class="c">${counts[i]}</div><div class="col" style="height:${Math.max(3, 100 * counts[i] / maxC) * .78}%"></div></div>`).join("");
document.querySelectorAll(".bar .c").forEach((el, i) => { const n = counts[i], t0 = performance.now(); el.textContent = 0;
  const tick = now => { const g = Math.min(1, (now - t0) / 900); el.textContent = Math.round(n * (1 - Math.pow(1 - g, 3))); if (g < 1) requestAnimationFrame(tick); }; requestAnimationFrame(tick); });
document.getElementById("names").insertAdjacentHTML("beforeend", ZOO.map(z => `<div><div class="e">${z.e}</div><div class="r">${z.n}<br>${z.r}</div></div>`).join(""));

// quip + awards
const best = ZOO[counts.indexOf(maxC)];
const legal = counts[0] + counts[1] + counts[2];
document.getElementById("quip").innerHTML = !P.length
  ? (STATS.n ? `${STATS.n} animal${STATS.n === 1 ? "" : "s"} passed, too few at a time to show which.` : "No animals that day. Not even a snail.")
  : `That day the street was mostly <b>${best.n}</b> ${best.e} (${best.quip}). ` +
  `${legal} animals kept to duck speed or slower; <b>${counts.slice(3).reduce((x, y) => x + y, 0)}</b> did not. ` +
  `${counts[6] ? `<b>${counts[6]}</b> rocket${counts[6] === 1 ? "" : "s"} 🚀 left the atmosphere.` : "No rockets that day. Small mercies."}`;
const hrs = STATS.hours.filter(h => h.n);
// An award needs passes to give it to: none on an empty day.
const big = hrs.filter(h => h.n >= 5);
const wild = big.length ? big.reduce((a, b) => (b.over / b.n > a.over / a.n ? b : a)) : null;
const calm = big.length ? big.reduce((a, b) => (b.over / b.n < a.over / a.n ? b : a)) : null;
document.getElementById("awards").innerHTML = [
  STATS.fastest && [A(STATS.fastest).e, PELICAN ? "Fastest rider" : "Fastest beast", `about ${STATS.fastest.mph} ${UNIT}, ${quarterRange(STATS.fastest.q)}`],
  wild && [PELICAN ? "🏁" : "🦓", "Wildest hour", `${hourLabel(wild.h)}: ${wild.over} of ${wild.n} over`],
  calm && [PELICAN ? ZOO[2].e : "🦆", PELICAN ? "Calmest ride" : "Duck pond hour", `${hourLabel(calm.h)}: calmest, ${calm.n - calm.over} of ${calm.n} legal`],
].filter(Boolean).map(([e, b, s]) => `<div class="aw"><div class="e">${e}</div><b>${b}</b><span>${s}</span></div>`).join("");

// hours, tinted by share over
document.getElementById("hours").innerHTML = hrs.map(h => {
  const share = h.over / h.n, mix = Math.round(share * 22);
  const top = ZOO[Math.max(...h.ps.map(p => zi(p.mph)))];
  return `<div class="hour" style="background:color-mix(in srgb, var(--hot) ${mix}%, transparent)"><b>${hourLabel(h.h)}</b>
    <div class="parade">${h.ps.map((p, k) => `<span tabindex="0" class="${facing(p)}" data-z="${zi(p.mph)}" data-p="${P.indexOf(p)}">${A(p).e}</span>`).join("")}</div>
    <div class="verdict">${h.n} · ${h.over} over · top ${top.e}</div></div>`;
}).join("");
const toast = document.getElementById("toast");
let tt;
function show(t) { toast.textContent = t; toast.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove("on"), 2600); }
document.getElementById("hours").addEventListener("click", e => { const s = e.target.closest("span[data-p]"); if (s) show(say(P[+s.dataset.p])); });
document.getElementById("hours").addEventListener("mouseover", e => { const s = e.target.closest("span[data-p]"); if (s) show(say(P[+s.dataset.p])); });
document.querySelectorAll(".bar").forEach(b => b.addEventListener("click", () => {
  const on = !b.classList.contains("sel");
  document.querySelectorAll(".bar").forEach(x => x.classList.remove("sel"));
  document.querySelectorAll(".parade").forEach(pr => {
    pr.classList.toggle("dim", on);
    pr.querySelectorAll("span").forEach(s => s.classList.toggle("match", on && s.dataset.z === b.dataset.i));
  });
  if (on) { b.classList.add("sel"); show(`${ZOO[+b.dataset.i].e} ${counts[+b.dataset.i]} ${ZOO[+b.dataset.i].n}: ${ZOO[+b.dataset.i].quip}`); }
}));

// the live parade: the day's animals cross in order, each at a pace set by its speed and moving like itself
const lane = document.getElementById("lane"), now = document.getElementById("now"), tally = document.getElementById("tally");
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
let next = 0, seen = 0, seenOver = 0, walkers = [], last = performance.now(), nextAt = 0;
function bit(cls, x, y, css) { const d = document.createElement("div"); d.className = cls; d.style.left = x + "px"; if (y != null) d.style.top = y + "px"; Object.assign(d.style, css || {}); lane.appendChild(d); return d; }
function describe(i) {
  const p = P[i];
  return PELICAN ? `<b>${quarterLabel(p.q)}</b> · ${PEL.describe(PERS[i])} · ${p.mph} ${UNIT}${p.dir < 0 ? " · the wrong way!" : ""}` : `<b>${quarterLabel(p.q)}</b> · ${A(p).one}, ${p.mph} ${UNIT}${p.dir < 0 ? " · the wrong way!" : ""}`;
}
// hold #now at the height of the longest line it will show at this width, so the page never jumps
function sizeNow() {
  const probe = now.cloneNode(false); probe.removeAttribute("id");
  Object.assign(probe.style, {position: "absolute", visibility: "hidden", height: "auto", minHeight: "0", width: now.getBoundingClientRect().width + "px"});
  now.parentNode.appendChild(probe);
  let h = 0;
  P.forEach((_, i) => { probe.innerHTML = describe(i); h = Math.max(h, probe.getBoundingClientRect().height); });
  probe.remove(); now.style.height = Math.ceil(h) + "px";
}
sizeNow(); let rs; addEventListener("resize", () => { clearTimeout(rs); rs = setTimeout(sizeNow, 120); });
function launch(t) {
  const p = P[next % P.length]; next++;
  if (next % P.length === 1) { seen = 0; seenOver = 0; }
  seen++; if (over(p)) seenOver++;
  const k = zi(p.mph), right = p.dir > 0, W = lane.clientWidth;
  const el = document.createElement("div"); el.className = "walker";
  const rocketTurn = !PELICAN && k === 6 ? (right ? "rotate(45deg)" : "scaleX(-1) rotate(45deg)") : "";
  const idx = (next - 1) % P.length, pel = PELICAN ? PEL.svg(PERS[idx], p.mph, 96) : null;
  if (pel) el.classList.add("pw");
  el.innerHTML = (k === 5 ? `<span class="lines" style="${right ? "right:100%" : "left:100%"}">≡</span>` : "") +
    (p.dir < 0 ? `<span class="huh" style="left:30px">❓</span>` : "") +
    `<span class="body ${PELICAN ? "" : "k" + k} ${facing(p) ? "right" : ""}" style="${rocketTurn ? `transform:${rocketTurn}` : ""}">${pel ? pel.html : A(p).e}</span>`;
  lane.appendChild(el);
  const pace = W / Math.max(700, 52000 / Math.max(p.mph * TO_MPH, 4));            // px per ms: a 40 mph rocket ~1.3 s across, a 5 mph snail ~10 s
  walkers.push({p, k, el, x: right ? -100 : W + 10, v: right ? pace : -pace, mid: false, trail: 0, G: pel && pel.G, legs: pel && el.querySelectorAll(".leg"), arm: pel && el.querySelector(".arm"), phase: 0, rpm: Math.max(.004, p.mph * TO_MPH * .0011)});
  now.innerHTML = describe(idx);
  tally.textContent = `${seen} of ${P.length} · ${seenOver} over`;
  nextAt = t + Math.max(380, Math.min(1500, 1 / pace / 3));
}
function step(t) {
  const dt = Math.min(50, t - last); last = t;
  const W = lane.clientWidth;
  if (t >= nextAt) launch(t);
  walkers = walkers.filter(w => {
    w.x += w.v * dt;
    w.el.style.transform = `translateX(${w.x}px)`;
    w.trail += dt;
    if (w.G) {  // pedal: crank round, legs follow (hip -> knee -> pedal)
      w.phase += w.rpm * dt; const [cx, cy] = w.G.crank, [sx, sy] = w.G.seat, hip = [sx + 2, sy - 2], L = w.G.bike === 2 ? 7 : 7;
      [0, Math.PI].forEach((o, n) => {
        const a = w.phase + o, px = cx + Math.cos(a) * L, py = cy + Math.sin(a) * L;
        const mx = (hip[0] + px) / 2, my = (hip[1] + py) / 2, d = Math.hypot(px - hip[0], py - hip[1]), bend = Math.max(2, 22 - d * .45);
        const kx = mx + bend, ky = my - bend * .3;
        w.legs[n].setAttribute("d", `M${hip[0]},${hip[1]} L${kx},${ky} L${px},${py} l4,0`);
        if (!n) { w.arm.setAttribute("x2", px); w.arm.setAttribute("y2", py); }
      });
    }
    if (!PELICAN && w.k === 0 && w.trail > 140) { w.trail = 0; const s = bit("slime", w.x + 16); s.animate([{opacity: .9}, {opacity: 0}], {duration: 4000}).onfinish = () => s.remove(); }
    if (w.k === 6 && w.trail > 45) { w.trail = 0; const s = bit("puff", w.x + (w.v > 0 ? (PELICAN ? 6 : -4) : (PELICAN ? 90 : 40)), (PELICAN ? 100 : 88) + Math.random() * 10);
      s.animate([{transform: "scale(.6)", opacity: .8}, {transform: `scale(2.4) translate(${w.v > 0 ? -10 : 10}px, -8px)`, opacity: 0}], {duration: 700, easing: "ease-out"}).onfinish = () => s.remove(); }
    if (!w.mid && (w.v > 0 ? w.x + (PELICAN ? 60 : 22) > W / 2 : w.x + (PELICAN ? 40 : 22) < W / 2)) {
      w.mid = true;
      if (over(w.p)) {
        const z = bit("zap", W / 2 + 28); z.textContent = `${w.p.mph}!`;
        z.animate([{transform: "translateY(6px) scale(.6)", opacity: 0}, {transform: "translateY(0) scale(1.1)", opacity: 1, offset: .2}, {transform: "translateY(-6px)", opacity: 0}], {duration: 1100}).onfinish = () => z.remove();
      }
    }
    if (w.x < -120 || w.x > W + 40) { w.el.remove(); return false; }
    return true;
  });
  requestAnimationFrame(step);
}
if (!still) requestAnimationFrame(t => { last = t; nextAt = t; step(t); });
else now.textContent = "Parade paused (reduced motion).";
</script></body></html>
